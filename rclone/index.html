<!doctype html>

  <title>Rclone Google Drive</title>
</head>
<body>
  <main>
    <h1>Rclone Google Drive</h1>
    <p>
      本应用是供所有者个人使用的 Google Drive 桌面集成，
      使用开源 rclone 软件将本人授权的 Google Drive 挂载到本机。
    </p>
    <h2>功能与权限</h2>
    <p>
      根据用户操作，读取文件和目录，以及上传、创建、修改、
      移动和删除文件。访问 Google Drive 前需要用户登录并授权。
    </p>
    <p>
      文件传输通过本机运行的 rclone 与 Google Drive API 完成。
      本网站仅提供应用说明，不接收网盘文件或 OAuth 凭据。
    </p>
    <p><a href="privacy.html">隐私政策</a></p>
    <p>联系所有者：请使用 OAuth 同意页面显示的支持邮箱。</p>
  </main>
</body>
</html>
